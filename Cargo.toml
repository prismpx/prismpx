[workspace]
resolver = "2"
members = ["crates/prismpx", "crates/prismpx-capi", "crates/prismpx-cli"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/prismpx/prismpx"
authors = ["shinyook <shinyook.lee@gmail.com>"]
rust-version = "1.87"

[profile.release]
lto = true
codegen-units = 1

# Tests exercise the compressor on real-sized images; unoptimized builds are needlessly slow.
[profile.test]
opt-level = 2
